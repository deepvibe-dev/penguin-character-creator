name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Check the lockfile is up to date
        run: uv lock --check
      - name: Install
        run: uv sync --frozen
      - name: Run tests (including Palmer penguins CSV compatibility)
        run: uv run pytest -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: penguin-creator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name penguins -p 8000:8000 penguin-creator:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 1; done
          curl -fsS http://localhost:8000/ | grep -q "<title>Penguin Creator</title>"
          curl -fsS http://localhost:8000/api/sample > sample.json
          curl -fsS -X PUT http://localhost:8000/api/workspace \
            -H 'Content-Type: application/json' --data-binary @sample.json
          docker exec penguins cat /data/penguins.csv > written.csv
          cmp written.csv penguin_creator/data/penguins_lter.csv
          echo "Container round-trips the original CSV byte-for-byte."
      - name: Container logs
        if: failure()
        run: docker logs penguins

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
