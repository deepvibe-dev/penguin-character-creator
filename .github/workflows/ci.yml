name: CI/CD

# Pull requests: check commit messages, run the tests, build + smoke-test the
#                image for linux/amd64 and linux/arm64.
# main:          the same checks, then release: commitizen derives the next
#                semantic version from the Conventional Commits since the last
#                tag, updates CHANGELOG.md, tags vX.Y.Z and the multi-arch image
#                is published to GHCR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a release half-way on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.5"
  COMMITIZEN_VERSION: "4.19.2"
  PLATFORMS: linux/amd64,linux/arm64
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check the PR title (used as the squash-merge commit message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: uvx --from "commitizen==${COMMITIZEN_VERSION}" cz check --message "$TITLE"
      - name: Check every commit in the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uvx --from "commitizen==${COMMITIZEN_VERSION}" cz check --rev-range "$BASE..$HEAD"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Check the lockfile is up to date
        run: uv lock --check
      - name: Install (Python version from .python-version)
        run: uv sync --frozen
      - name: Run tests (including Palmer penguins CSV compatibility)
        run: uv run pytest -v

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: penguin-creator:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test the container
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run -d --name penguins --platform "linux/${ARCH}" -p 8000:8000 penguin-creator:ci
          test "$(docker exec penguins uname -m)" = "$([ "$ARCH" = amd64 ] && echo x86_64 || echo aarch64)"
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/healthz && break; sleep 1; done
          curl -fsS http://localhost:8000/ | grep -q "<title>Penguin Creator</title>"
          curl -fsS http://localhost:8000/api/sample > sample.json
          curl -fsS -X PUT http://localhost:8000/api/workspace \
            -H 'Content-Type: application/json' --data-binary @sample.json
          docker exec penguins cat /data/penguins.csv > written.csv
          cmp written.csv penguin_creator/data/penguins_lter.csv
          echo "linux/${ARCH} container round-trips the original CSV byte-for-byte."
      - name: Container logs
        if: failure()
        run: docker logs penguins

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Bump version from Conventional Commits
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          uvx --from "commitizen==${COMMITIZEN_VERSION}" cz bump --yes
          code=$?
          set -e
          # 3 = NO_COMMITS_FOUND, 21 = NO_INCREMENT (only docs/chore/ci/test/build commits)
          if [ "$code" = 3 ] || [ "$code" = 21 ]; then
            echo "Nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$code" = 0 ] || exit "$code"
          version=$(uvx --from "commitizen==${COMMITIZEN_VERSION}" cz version --project)
          # release notes = this version's section of CHANGELOG.md
          awk -v h="## v${version} " 'index($0, h) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > release-notes.md
          git push --atomic origin HEAD:main "v${version}"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: GitHub release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # build the release commit when one was made, else the pushed commit
          ref: ${{ needs.release.outputs.released == 'true' && format('v{0}', needs.release.outputs.version) || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # vX.Y.Z -> X.Y.Z, X.Y, X (not for 0.x) and latest; every main build -> main + sha
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' && !startsWith(needs.release.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ needs.release.outputs.released == 'true' }}
            type=raw,value=main
            type=sha
      - name: Build and push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
