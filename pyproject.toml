[project]
name = "penguin-creator"
version = "1.0.0"
description = "A pixel-art character creator for building Palmer-penguins-compatible datasets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The app itself only uses the Python standard library.
dependencies = []

[project.scripts]
penguin-creator = "penguin_creator.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pandas>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["penguin_creator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
